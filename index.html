document.addEventListener('input',e=>{const t=e.target;if(t.dataset.m)D.m[t.dataset.m]=t.value;if(t.dataset.c)D.c[t.dataset.c]=t.value;if(t.dataset.o!=null)D.ch.o[+t.dataset.o]=t.value;if(t.dataset.q)D.ch.q=t.value;if(t.dataset.dim!=null){S.dim=+t.value;const dv=$('#dimv');if(dv)dv.textContent=t.value;const dm=$('.dim');if(dm)dm.style.opacity=t.value/100;save()}if(t.dataset.mu){S.mu[t.dataset.mu]=t.value.trim();save()}if(t.dataset.as){S.asr[t.dataset.as]=t.value;save()}if(t.dataset.tip!=null){fr(S.cur).tip=t.value;save()}if(t.dataset.ttip!=null){fr(S.cur).ttip=t.value;save()}if(t.dataset.dmin!=null){fr(S.cur).dmin=+t.value||0;save()}if(t.dataset.dmax!=null){fr(S.cur).dmax=+t.value||0;save()}if(t.dataset.rtip!=null){fr(S.cur).rtip=t.value;save()}if(t.dataset.r)D.rp[t.dataset.r]=t.value;if(t.id=='ci')t.parentElement.classList.toggle('has',!!t.value);if(t.id=='cs'){D.cs=t.value;$('#cl').innerHTML=cardList()}if(t.id=='sq'){S.search=t.value;$('#panel').innerHTML=panel()}});
document.addEventListener('dblclick',e=>{if(e.target.closest('[data-tab=group]')){D.modal='grp';render()}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.loc!=null){fr(D.sf).loc=t.value.trim();save();render()}if(t.dataset.mv){fr(S.cur).group=t.value;save()}if(t.dataset.gn!=null){const i=+t.dataset.gn,o=S.groups[i],n=t.value.trim();if(n&&!S.groups.includes(n)){S.friends.forEach(f=>{if(f.group==o)f.group=n});S.groups[i]=n;save()}else t.value=o}if(t.dataset.m)D.m[t.dataset.m]=t.value;if(t.dataset.c)D.c[t.dataset.c]=t.value});

async function applyFont(){let st=document.getElementById('fs');if(!st){st=document.createElement('style');st.id='fs';document.head.append(st)}
 const f=S.fonts.find(x=>x.name==S.font);if(!f){st.textContent='';return}
 try{const ff=new FontFace('UF',`url(${f.data})`);await ff.load();document.fonts.add(ff)}catch(e){toast('字体加载失败');S.font=''}
 st.textContent="body{font-family:'UF','Noto Sans SC',sans-serif}"}
function beep(){try{const c=new AudioContext();[0,.35,.7].forEach(t=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=880;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.2,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t+.25);o.start(c.currentTime+t);o.stop(c.currentTime+t+.3)})}catch(e){}}
setInterval(()=>{const sb=$('#sb');if(sb)sb.innerHTML=sbin();mtick();document.querySelectorAll('.cd').forEach(e=>e.textContent=cdate());document.querySelectorAll('.ctimer').forEach(e=>e.textContent=ct());document.querySelectorAll('.ct').forEach(e=>e.textContent=ctime());
 if(D.call&&now()>(D.call.nx||(D.call.nx=now()+cgap()))){D.call.nx=now()+cgap();D.call.st=pickCards('',D.call.v?'vd':'vc',1)[0]||D.call.st;document.querySelectorAll('.cst').forEach(e=>e.textContent=D.call.st)}
 S.friends.forEach(f=>{if(f.pro&&Math.random()<.004){const c=pickCards('','chat',1)[0];if(c)cpush(f.id,{k:'t',t:c})}});
 if(Math.floor(now()/6e4)!=D.mk){D.mk=Math.floor(now()/6e4);autoPost()}
 S.todos.forEach(t=>{if(t.time&&!t.fired&&new Date(t.time)<=new Date()){t.fired=true;save();beep();toast('⏰ '+t.text);const f=fr(t.fid)||S.friends[0];if(f)cpush(f.id,t.type=='提醒'?{k:'rm',t:'「'+t.text+'」做了吗？做了我替你划掉',tid:t.id}:{k:'t',t:'「'+t.text+'」到时间啦'})}})},1000);
try{navigator.serviceWorker?.register('sw.js')}catch(e){}
/* ===== 阅读 ===== */
S.rd=Object.assign({fid:'',min:20,max:60,p:60,fs:17,th:'auto',bg:'#f1e5c9',fg:'#4a3b28'},S.rd);S.books=S.books||[];D.rses={};
const RPS=480,RTH={day:['#f7f5f0','#222'],night:['#151518','#a9a9b0'],eye:['#c7e0c4','#28362a'],paper:['#f1e5c9','#4a3b28']},RTN={auto:'跟随系统',day:'日间',night:'夜间',eye:'护眼',paper:'纸张',custom:'自定义'},rbk=id=>S.books.find(b=>b.id==id);
function rdb(k,v){return new Promise((ok,no)=>{const q=indexedDB.open('jyread',1);q.onupgradeneeded=()=>q.result.createObjectStore('b');q.onerror=()=>no(q.error);q.onsuccess=()=>{const s=q.result.transaction('b',v===undefined?'readonly':'readwrite').objectStore('b'),r=v===undefined?s.get(k):v===null?s.delete(k):s.put(v,k);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}})}
function rdUp(){const f=document.createElement('input');f.type='file';f.accept='.txt,text/plain';f.onchange=async()=>{const x=f.files[0];if(!x)return;const buf=await x.arrayBuffer();let t;try{t=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){t=new TextDecoder('gbk').decode(buf)}
 t=t.replace(/\r\n?/g,'\n').replace(/\n{3,}/g,'\n\n').trim();if(!t)return toast('文件是空的');const id='b'+now();try{await rdb(id,t)}catch(e){return toast('保存失败')}S.books.unshift({id,name:x.name.replace(/\.txt$/i,''),pg:0,n:{},done:{}});save();render()};f.click()}
function rdPages(t){const P=[];let c='';t.split('\n').forEach(l=>{while(l.length>RPS){if(c){P.push(c);c=''}P.push(l.slice(0,RPS));l=l.slice(RPS)}if(c&&c.length+l.length>RPS){P.push(c);c=''}c+=(c?'\n':'')+l});if(c)P.push(c);return P}
async function rdOpen(id){const b=rbk(id);D.bk=id;D.rpg=null;D.rs=0;D.rsc=0;render();const t=await rdb(id).catch(()=>null);if(!t){toast('书的内容找不到了');D.bk=null;return render()}D.rpg=rdPages(t);b.tot=D.rpg.length;b.pg=Math.min(b.pg,b.tot-1);save();render();rdStart()}
function rdTh(){const r=S.rd;let k=r.th;if(k=='auto')k=matchMedia('(prefers-color-scheme: dark)').matches?'night':'day';const c=k=='custom'?[r.bg,r.fg]:RTH[k]||RTH.day;return{k,b:c[0],f:c[1]}}
function rdHtml(t,ns){let h='',p=0;[...ns].sort((a,b)=>a.s-b.s).forEach(n=>{if(n.s<p)return;const q=esc(t.slice(n.s,n.e));h+=esc(t.slice(p,n.s))+(n.k=='n'?`<span class="rl">${q}</span><span class="rn">${esc(n.t)}</span>`:q+(n.k=='i'?`<img class="rsk" src="${esc(n.u)}" data-zoom="1">`:`<span class="rn rsx">${esc(n.x)}</span>`));p=n.e});return(h+esc(t.slice(p))).replace(/\n/g,'<br>')}
function rdSetHtml(){const r=S.rd;return`<label class="rdl">陪读</label><select data-rdk="fid"><option value="">不陪读</option>${S.friends.map(x=>`<option value="${x.id}" ${r.fid==x.id?'selected':''}>${esc(dn(x))}</option>`).join('')}</select>
<label class="rdl">char 每页阅读时间（秒）</label><div class="flex2"><input type="number" min="3" data-rdk="min" value="${r.min}"><span style="align-self:center">~</span><input type="number" min="3" data-rdk="max" value="${r.max}"></div>
<label class="rdl">划线 / 贴纸概率 ${r.p}%（每页）</label><input type="range" min="0" max="100" data-rdk="p" value="${r.p}">
<label class="rdl">字号 ${r.fs}</label><input type="range" min="13" max="26" data-rdk="fs" value="${r.fs}">
<label class="rdl">页面颜色</label><div>${Object.entries(RTN).map(([k,v])=>`<span class="tab2 tap ${r.th==k?'on':''}" data-rdth="${k}">${v}</span>`).join('')}</div>
${r.th=='custom'?`<div class="flex2" style="margin-top:8px"><input type="color" data-rdk="bg" value="${r.bg}" title="背景"><input type="color" data-rdk="fg" value="${r.fg}" title="文字"></div>`:''}
<p style="font-size:12px;color:var(--sub)">批注从字卡库「读书批注」类别里找，没有就用默认类别；贴纸用颜文字 / emoji / 你的表情包。</p>`}
function read(){if(!D.bk)return`<div class="pg"><div class="hd"><b class="serif" style="font-size:24px">Reading</b><button class="btn tap" data-rd="up">上传 txt</button></div>
<div class="card">${S.books.map(b=>`<div class="todo"><span class="tap" style="flex:1" data-rdb="${b.id}">${esc(b.name)}</span><small style="color:var(--sub)">${b.tot?`${b.pg+1}/${b.tot}`:'未读'}</small><span class="tap" data-rddel="${b.id}">×</span></div>`).join('')||'<div class="empty">还没有书，上传一个 txt 吧</div>'}</div>
<div class="card"><b>阅读设置</b>${rdSetHtml()}</div></div>`;
 const b=rbk(D.bk),P=D.rpg,th=rdTh();setTimeout(()=>{const e=$('#rdb');if(e)e.scrollTop=D.rsc||0;rdSt()});
 return`<div class="rdr ${th.k=='night'?'dk':''}" style="background:${th.b};color:${th.f}"><div class="rdh"><span class="tap" data-rd="back">${ic('back')}</span><span class="rdt">${esc(b.name)}</span><span class="tap" data-rd="night">${th.k=='night'?'☀':'☾'}</span><span class="tap" data-rd="opt">Aa</span></div>
<div class="rdst" id="rdst"></div><div class="rdb" id="rdb" style="font-size:${S.rd.fs}px">${P?rdHtml(P[b.pg],b.n[b.pg]||[]):'加载中…'}</div>
<div class="rdf"><span class="tap" data-rd="prev">‹ 上一页</span><span>${P?b.pg+1+' / '+P.length:''}</span><span class="tap" data-rd="next">下一页 ›</span></div>${D.rs?`<div class="rds">${rdSetHtml()}</div>`:''}</div>`}
function rdSt(){const e=$('#rdst'),b=rbk(D.bk),f=fr(S.rd.fid);if(!e||!b)return;const s=D.rses[b.id+':'+b.pg];e.textContent=!f?'':s?`${dn(f)} 正在读这一页 · ${Math.min(99,Math.floor((now()-s.t0)/s.T*100))}%`:b.done[b.pg]?`${dn(f)} 读完这页了`:''}
function rdPaint(){const e=$('#rdb'),b=rbk(D.bk);if(!e||!b||!D.rpg)return;const st=e.scrollTop;e.innerHTML=rdHtml(D.rpg[b.pg],b.n[b.pg]||[]);e.scrollTop=st;rdSt()}
function rdStart(){const b=rbk(D.bk),f=fr(S.rd.fid),r=S.rd;if(!b||!f||!D.rpg)return;const pg=b.pg,key=b.id+':'+pg,txt=D.rpg[pg];if(b.done[pg]||D.rses[key])return;
 const lo=Math.max(3,Math.min(+r.min||20,+r.max||60)),hi=Math.max(lo,+r.min||0,+r.max||0),T=(lo+Math.random()*(hi-lo))*1e3,ss=[],pk=[];
 D.rses[key]={t0:now(),T};b.done[pg]=1;save();
 txt.replace(/[^。！？!?…；;\n]+[。！？!?…；;」”』）)]*/g,(m,i)=>{const a=m.search(/\S/);if(m.trim().length>=6)ss.push([i+a,i+m.trimEnd().length]);return m});
 if(ss.length&&Math.random()*100<r.p){let n=1+Math.floor(Math.random()*Math.min(3,ss.length));while(n--)pk.push(ss.splice(Math.floor(Math.random()*ss.length),1)[0])}
 pk.forEach(([s,e])=>setTimeout(()=>rdNote(b,pg,s,e,txt.slice(s,e)),T*e/txt.length*(.8+Math.random()*.2)));
 setTimeout(()=>{delete D.rses[key];rdSt()},T);rdSt()}
function rdNote(b,pg,s,e,q){const sk=ctk();let o;if(Math.random()<.6){const c=pickCards(q,'rd',1)[0]||pickCards(q,'chat',1)[0];if(c)o={k:'n',t:c}}
 if(!o)o=sk.length&&Math.random()<.5?{k:'i',u:pickOne(sk).u}:{k:'s',x:pickOne(FACES)};(b.n[pg]=b.n[pg]||[]).push({...o,s,e});save();if(D.bk==b.id&&b.pg==pg)rdPaint()}
document.addEventListener('click',e=>{const t=e.target.closest?.('[data-rd],[data-rdth],[data-rdb],[data-rddel]');if(!t)return;const d=t.dataset,b=rbk(D.bk),a=d.rd;
 if(d.rdb)return rdOpen(d.rdb);
 if(d.rddel){if(!confirm('删除这本书和批注？'))return;S.books=S.books.filter(x=>x.id!=d.rddel);rdb(d.rddel,null).catch(()=>{});save();return render()}
 if(d.rdth){S.rd.th=d.rdth;save();return render()}
 if(a=='up')rdUp();else if(a=='back'){D.bk=null;render()}else if(a=='opt'){D.rs=!D.rs;render()}
 else if(a=='night'){S.rd.th=rdTh().k=='night'?'day':'night';save();render()}
 else if((a=='prev'||a=='next')&&D.rpg){const n=b.pg+(a=='next'?1:-1);if(n<0||n>=D.rpg.length)return toast(n<0?'已经是第一页':'读完啦');b.pg=n;D.rsc=0;save();render();rdStart()}});
document.addEventListener('change',e=>{const k=e.target.dataset?.rdk;if(!k)return;S.rd[k]=['min','max','p','fs'].includes(k)?+e.target.value:e.target.value;save();render();if(k=='fid')rdStart()});
document.addEventListener('scroll',e=>{if(e.target.id=='rdb')D.rsc=e.target.scrollTop},true);
setInterval(()=>{if(S.page=='read'&&D.bk)rdSt()},1000);
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(S.page=='read'&&D.bk&&S.rd.th=='auto')render()});
/* ===== 阅读 end ===== */
applyFont();render();
</script><script src="dict.js"></script></body></html>
