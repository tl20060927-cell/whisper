 else if(a=='hang'){const c=D.call;D.call=null;if(c.st&&!c.st.startsWith('（'))fr(c.f).mood=c.st;const t=Math.floor((now()-c.start)/1e3);fr(c.f).msgs.push({f:'m',k:'call',t:(c.v?'视频':'语音')+'通话 '+pad(Math.floor(t/60))+':'+pad(t%60),ts:now()});save();render()}
 else if(a=='mtog'){D.aud.paused?D.aud.play():D.aud.pause();render()}
 else if(a=='mstop'){D.aud.pause();D.aud=null;render()}
 else if(a=='upcard')pickRaw('.txt,.json,.docx',async f=>{try{const l=await parseFile(f),n=S.cards.length;l.forEach(x=>S.cards.push({t:x,c:D.cat||'chat'}));dd();save();toast('新增 '+(S.cards.length-n)+' 张字卡');render()}catch(e){toast('无法识别该文件')}});
 else if(a=='expcard'){if(!S.cards.length)return toast('字卡库为空');exp('字卡库.txt',S.cards.filter(x=>x.c==(D.cat||'chat')).map(x=>x.t).join('\n'))}
 else if(a=='upstk')pick(u=>{S.stk.push({u,d:($('#sd')?.value||'').trim()});save();render()});
 else if(a=='impstk')pickRaw('.txt,.json',async f=>{try{const r=parseStk((await f.text()).split(/\r?\n/).map(x=>x.trim()).filter(Boolean));r.forEach(x=>S.stk.push(x));save();toast('导入 '+r.length+' 个表情包');render()}catch(e){toast('导入失败')}});
 else if(a=='search'){S.page='home';S.showSearch=!S.showSearch;if(!S.showSearch)S.search='';render();$('#sq')?.focus()}
 else if(a=='addtodo'){const x=$('#tx').value.trim();if(!x)return;S.todos.push({id:now(),type:$('#tt').value,text:x,time:$('#tm').value,fid:S.cur||S.friends[0]?.id,done:false,fired:false});save();render()}
 else if(a=='upfont')pick((u,f)=>{const n=f.name.replace(/\.\w+$/,'');S.fonts.push({name:n,data:u});S.font=n;applyFont();save();render()},'.ttf,.otf,.woff,.woff2');
 else if(a=='upbg')pick(u=>{S.bg=u;save();render()});
 else if(a=='rmbg'){S.bg='';save();render()}
});
document.addEventListener('focusout',e=>{const p=e.target.dataset?.ed;if(p){const v=e.target.textContent;set(p,['me.follow','me.fans'].includes(p)?v:v)}});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='cin'){e.preventDefault();cgo()}if(e.key=='Enter'&&e.target.id=='mi'){e.preventDefault();document.querySelector('[data-act=csend]').click()}if(e.key=='Enter'&&e.target.id=='ci'){e.preventDefault();document.querySelector('[data-act=send]').click()}if(e.key=='Enter'&&e.target.dataset?.ed){e.preventDefault();e.target.blur()}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.m)D.m[t.dataset.m]=t.value;if(t.dataset.c)D.c[t.dataset.c]=t.value;if(t.dataset.o!=null)D.ch.o[+t.dataset.o]=t.value;if(t.dataset.q)D.ch.q=t.value;if(t.dataset.as){S.asr[t.dataset.as]=t.value;save()}if(t.dataset.tip!=null){fr(S.cur).tip=t.value;save()}if(t.dataset.r)D.rp[t.dataset.r]=t.value;if(t.id=='ci')t.parentElement.classList.toggle('has',!!t.value);if(t.id=='cs'){D.cs=t.value;$('#cl').innerHTML=cardList()}if(t.id=='sq'){S.search=t.value;$('#panel').innerHTML=panel()}});
document.addEventListener('dblclick',e=>{if(e.target.closest('[data-tab=group]')){D.modal='grp';render()}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.mv){fr(S.cur).group=t.value;save()}if(t.dataset.gn!=null){const i=+t.dataset.gn,o=S.groups[i],n=t.value.trim();if(n&&!S.groups.includes(n)){S.friends.forEach(f=>{if(f.group==o)f.group=n});S.groups[i]=n;save()}else t.value=o}if(t.dataset.m)D.m[t.dataset.m]=t.value;if(t.dataset.c)D.c[t.dataset.c]=t.value});

async function applyFont(){let st=document.getElementById('fs');if(!st){st=document.createElement('style');st.id='fs';document.head.append(st)}
 const f=S.fonts.find(x=>x.name==S.font);if(!f){st.textContent='';return}
 try{const ff=new FontFace('UF',`url(${f.data})`);await ff.load();document.fonts.add(ff)}catch(e){toast('字体加载失败');S.font=''}
 st.textContent="body{font-family:'UF','Noto Sans SC',sans-serif}"}
function beep(){try{const c=new AudioContext();[0,.35,.7].forEach(t=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=880;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.2,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t+.25);o.start(c.currentTime+t);o.stop(c.currentTime+t+.3)})}catch(e){}}
setInterval(()=>{const sb=$('#sb');if(sb)sb.innerHTML=sbin();document.querySelectorAll('.cd').forEach(e=>e.textContent=cdate());document.querySelectorAll('.ctimer').forEach(e=>e.textContent=ct());document.querySelectorAll('.ct').forEach(e=>e.textContent=ctime());
 if(D.call&&now()-(D.call.sa||D.call.start)>2e4){D.call.sa=now();D.call.st=pickCards('',D.call.v?'vd':'vc',1)[0]||D.call.st;document.querySelectorAll('.cst').forEach(e=>e.textContent=D.call.st)}
 S.friends.forEach(f=>{if(f.pro&&Math.random()<.004){const c=pickCards('','chat',1)[0];if(c)cpush(f.id,{k:'t',t:c})}});
 S.friends.forEach(f=>{if(f.mo&&Math.random()<.008){const c=pickCards('','chat',1)[0];if(c){S.moments.unshift({id:now(),ts:now(),au:f.id,text:c,imgs:[],likes:[],cm:[]});save();if(S.page=='moments')render()}}});
 S.todos.forEach(t=>{if(t.time&&!t.fired&&new Date(t.time)<=new Date()){t.fired=true;save();beep();toast('⏰ '+t.text);const f=fr(t.fid)||S.friends[0];if(f)cpush(f.id,t.type=='提醒'?{k:'rm',t:'「'+t.text+'」做了吗？做了我替你划掉',tid:t.id}:{k:'t',t:'「'+t.text+'」到时间啦'})}})},1000);
applyFont();render();
</script></body></html>
